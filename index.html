<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名單篩選與匯出工具</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Import map: resolve bare module specifiers for Babel standalone -->
  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18",
      "react/jsx-runtime":"https://esm.sh/react@18/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "lucide-react":     "https://esm.sh/lucide-react@0.468.0"
    }
  }
  </script>

  <!-- Babel standalone (transforms JSX → JS at runtime, supports ES-module mode) -->
  <script src="https://unpkg.com/@babel/standalone@7.27.1/babel.min.js"></script>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useMemo, useRef, useCallback, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Upload, Download, Search, FileText, X, Filter, Trash2, Info, Ban, CheckCircle2, FileUp, ExternalLink, AlertTriangle } from 'lucide-react';

    // --- 工具函數 ---

    // 產生唯一 ID
    const generateId = (index) => `row_${Date.now()}_${index}_${Math.random().toString(36).substring(2, 9)}`;

    // 解析 CSV 字串為物件陣列
    const parseCSV = (text) => {
      const result = [];
      let row = [];
      let inQuotes = false;
      let value = "";

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"' && inQuotes && nextChar === '"') {
          value += '"';
          i++; // 跳過跳脫的引號
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++; // 處理 \r\n
          row.push(value);
          result.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }
      if (value !== "" || row.length > 0) {
        row.push(value);
        result.push(row);
      }

      const validRows = result.filter(r => r.some(cell => cell.trim() !== ''));
      if (validRows.length === 0) return { headers: [], data: [] };

      const headers = validRows[0];
      const data = validRows.slice(1).map((cells, index) => ({
        id: generateId(index),
        cells: cells
      }));

      return { headers, data };
    };

    // 將二維陣列轉換回 CSV 字串
    const unparseCSV = (headers, dataRows) => {
      const escapeCell = (cell) => {
        if (cell == null) return '""';
        const str = String(cell);
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };

      const headerRow = headers.map(escapeCell).join(',');
      const rows = dataRows.map(row => row.map(escapeCell).join(','));
      return [headerRow, ...rows].join('\n');
    };

    function App() {
      const [fileName, setFileName] = useState('');
      const [headers, setHeaders] = useState([]);
      const [data, setData] = useState([]);
      const [globalSearch, setGlobalSearch] = useState('');
      const [columnFilters, setColumnFilters] = useState({});
      const [excludedRowIds, setExcludedRowIds] = useState(new Set());
      const [isDragging, setIsDragging] = useState(false);
      const [showConfirmModal, setShowConfirmModal] = useState(false);

      const fileInputRef = useRef(null);
      const dragCounter = useRef(0);

      // --- 關閉網頁/重整防護機制 ---
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (data.length > 0) {
            const message = '您還有未匯出的資料，確定要離開嗎？';
            e.returnValue = message;
            return message;
          }
        };

        window.addEventListener('beforeunload', handleBeforeUnload);

        return () => {
          window.removeEventListener('beforeunload', handleBeforeUnload);
        };
      }, [data.length]);

      // 處理檔案
      const processFile = (file) => {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.csv')) {
          alert('請上傳 CSV 格式的檔案！');
          return;
        }

        setFileName(file.name);
        const reader = new FileReader();

        reader.onload = (event) => {
          const text = event.target.result;
          const { headers: parsedHeaders, data: parsedData } = parseCSV(text);

          if (parsedData.length > 0) {
            setHeaders(parsedHeaders);
            setData(parsedData);
            setGlobalSearch('');
            setColumnFilters({});
            setExcludedRowIds(new Set());
          } else {
            alert('無法解析檔案或檔案為空。');
          }
        };
        reader.readAsText(file, 'UTF-8');
      };

      const handleFileUpload = (e) => {
        processFile(e.target.files[0]);
        e.target.value = '';
      };

      // --- 拖拉事件處理 ---
      const handleDragEnter = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter.current += 1;
        if (e.dataTransfer.items && e.dataTransfer.items.length > 0) {
          setIsDragging(true);
        }
      }, []);

      const handleDragLeave = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter.current -= 1;
        if (dragCounter.current === 0) {
          setIsDragging(false);
        }
      }, []);

      const handleDragOver = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        dragCounter.current = 0;

        const files = e.dataTransfer.files;
        if (files && files.length > 0) {
          processFile(files[0]);
        }
      }, []);

      const handleColumnFilterChange = (colIndex, value) => {
        setColumnFilters(prev => ({ ...prev, [colIndex]: value }));
      };

      const handleDoubleClickRow = (id) => {
        if (window.getSelection) window.getSelection().removeAllRanges();
        setExcludedRowIds(prev => {
          const newSet = new Set(prev);
          newSet.has(id) ? newSet.delete(id) : newSet.add(id);
          return newSet;
        });
      };

      const filteredData = useMemo(() => {
        if (!data || data.length === 0) return [];
        return data.filter(row => {
          if (globalSearch) {
            const searchLower = globalSearch.toLowerCase();
            const matchesGlobal = row.cells.some(cell => String(cell).toLowerCase().includes(searchLower));
            if (!matchesGlobal) return false;
          }
          for (const [colIdx, term] of Object.entries(columnFilters)) {
            if (term) {
              const cellValue = String(row.cells[colIdx] || '').toLowerCase();
              if (!cellValue.includes(term.toLowerCase())) return false;
            }
          }
          return true;
        });
      }, [data, globalSearch, columnFilters]);

      const rowsToExport = useMemo(() => {
        return filteredData.filter(row => !excludedRowIds.has(row.id)).map(row => row.cells);
      }, [filteredData, excludedRowIds]);

      const handleExport = () => {
        if (rowsToExport.length === 0) {
          alert("沒有可匯出的資料！");
          return;
        }
        const csvContent = unparseCSV(headers, rowsToExport);
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `filtered_${fileName || 'export.csv'}`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const promptClearAll = () => {
        setShowConfirmModal(true);
      };

      const handleClearAll = () => {
        setFileName('');
        setHeaders([]);
        setData([]);
        setGlobalSearch('');
        setColumnFilters({});
        setExcludedRowIds(new Set());
        setShowConfirmModal(false);
      };

      const isFiltered = globalSearch !== '' || Object.values(columnFilters).some(v => v !== '');

      // --- 內容渲染輔助函數 ---
      const renderCellContent = (content, headerName, isExcluded) => {
        const strContent = String(content || '');
        if (!strContent) return '';

        if (strContent.startsWith('http://') || strContent.startsWith('https://')) {
          return (
            <a
              href={strContent}
              target="_blank"
              rel="noopener noreferrer"
              className={`inline-flex items-center gap-1 hover:underline truncate max-w-full ${isExcluded ? 'text-red-800/60' : 'text-blue-600'}`}
              onClick={(e) => e.stopPropagation()}
            >
              {strContent}
              <ExternalLink size={12} className="flex-shrink-0 opacity-50" />
            </a>
          );
        }

        const isInstagramCol = headerName.toLowerCase().includes('instagram') || headerName.toLowerCase() === 'ig';
        if (isInstagramCol && !strContent.includes(' ')) {
          let account = strContent;
          if (account.includes('/')) {
            account = account.split('/')[0].trim();
          }
          account = account.replace(/^@/, '');

          if (account && account.length > 0 && !account.includes(' ')) {
            return (
              <div className="flex flex-col gap-1">
                <span className="truncate">{strContent}</span>
                <a
                  href={`https://instagram.com/${account}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`inline-flex items-center gap-1 text-xs hover:underline w-fit ${isExcluded ? 'text-red-800/60' : 'text-pink-600'}`}
                  onClick={(e) => e.stopPropagation()}
                >
                  @ {account}
                  <ExternalLink size={10} className="flex-shrink-0 opacity-50" />
                </a>
              </div>
            );
          }
        }

        return <span className="truncate block" title={strContent}>{strContent}</span>;
      };

      return (
        <div
          className={`min-h-screen font-sans relative transition-colors duration-200 ${
            isDragging ? 'bg-indigo-50' : 'bg-slate-50'
          }`}
          onDragEnter={handleDragEnter}
          onDragLeave={handleDragLeave}
          onDragOver={handleDragOver}
          onDrop={handleDrop}
        >
          {/* 拖拉遮罩 */}
          {isDragging && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-indigo-500/10 backdrop-blur-sm border-4 border-indigo-500 border-dashed m-4 rounded-3xl pointer-events-none">
              <div className="bg-white p-8 rounded-2xl shadow-xl flex flex-col items-center gap-4">
                <FileUp size={64} className="text-indigo-600 animate-bounce" />
                <h2 className="text-2xl font-bold text-slate-800">放開滑鼠即可載入 CSV</h2>
                <p className="text-slate-500">放開以覆蓋並讀取您的檔案</p>
              </div>
            </div>
          )}

          {/* 關閉檔案確認 Modal */}
          {showConfirmModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full overflow-hidden scale-in-95 duration-200">
                <div className="p-6">
                  <div className="flex items-center justify-center w-12 h-12 bg-red-100 rounded-full mb-4 mx-auto">
                    <AlertTriangle className="text-red-600 w-6 h-6" />
                  </div>
                  <h3 className="text-lg font-bold text-slate-900 text-center mb-2">確定要關閉檔案嗎？</h3>
                  <p className="text-slate-500 text-sm text-center">
                    這將會清除您目前所有的過濾條件，以及<strong className="text-red-500 font-medium">標記排除 ({excludedRowIds.size} 筆)</strong>的紀錄。此動作無法復原。
                  </p>
                </div>
                <div className="bg-slate-50 px-6 py-4 flex gap-3 justify-end border-t border-slate-100">
                  <button
                    onClick={() => setShowConfirmModal(false)}
                    className="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 bg-white border border-slate-300 hover:bg-slate-50 rounded-lg transition-colors flex-1 md:flex-none"
                  >
                    取消
                  </button>
                  <button
                    onClick={handleClearAll}
                    className="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors flex-1 md:flex-none"
                  >
                    確定關閉
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="p-4 md:p-8 max-w-[1400px] mx-auto space-y-4">

            {/* 頂部操作列 */}
            <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 relative z-10">
              <div>
                <h1 className="text-2xl font-bold flex items-center gap-2 text-slate-900">
                  <FileText className="text-indigo-600" />
                  名單篩選與匯出工具
                </h1>
                <p className="text-slate-500 mt-1 text-sm flex items-center gap-1.5">
                  <Info size={14} className="text-indigo-400" />
                  支援直接拖拉檔案 / 雙擊資料可標記為排除 / 網址可直接點擊
                </p>
              </div>

              <div className="flex items-center gap-3 w-full md:w-auto">
                <input
                  type="file"
                  accept=".csv"
                  className="hidden"
                  ref={fileInputRef}
                  onChange={handleFileUpload}
                />
                <button
                  onClick={() => fileInputRef.current.click()}
                  className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-lg transition-colors font-medium shadow-sm"
                >
                  <Upload size={18} />
                  {fileName ? '選擇其他檔案' : '上傳 CSV'}
                </button>

                {data.length > 0 && (
                  <button
                    onClick={handleExport}
                    disabled={rowsToExport.length === 0}
                    className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg transition-colors font-medium shadow-sm ${
                      rowsToExport.length > 0
                      ? 'bg-indigo-600 hover:bg-indigo-700 text-white'
                      : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }`}
                  >
                    <Download size={18} />
                    匯出結果 ({rowsToExport.length})
                  </button>
                )}
              </div>
            </header>

            {data.length > 0 ? (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col relative z-10">

                {/* 篩選控制區塊 */}
                <div className="p-4 border-b border-slate-200 bg-slate-50/50">
                  <div className="flex flex-col md:flex-row gap-4 items-center justify-between">

                    {/* 狀態標籤 */}
                    <div className="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                      <span className="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-1.5 rounded-md whitespace-nowrap">
                        名單：{fileName}
                      </span>
                      <span className="bg-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-1.5 rounded-md whitespace-nowrap">
                        總覽：{filteredData.length} 筆
                      </span>
                      {excludedRowIds.size > 0 && (
                        <span className="bg-red-100 text-red-700 text-xs font-semibold px-2.5 py-1.5 rounded-md whitespace-nowrap flex items-center gap-1">
                          <Ban size={12} />
                          已排除：{filteredData.filter(r => excludedRowIds.has(r.id)).length} 筆
                        </span>
                      )}
                    </div>

                    {/* 右側控制：搜尋與清除 */}
                    <div className="flex gap-3 w-full md:w-auto items-center">
                      <div className="relative w-full md:w-64 group">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Search size={16} className="text-slate-400 group-focus-within:text-indigo-500" />
                        </div>
                        <input
                          type="text"
                          className="block w-full pl-9 pr-8 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-shadow text-sm"
                          placeholder="全域搜尋..."
                          value={globalSearch}
                          onChange={(e) => setGlobalSearch(e.target.value)}
                        />
                        {globalSearch && (
                          <button
                            onClick={() => setGlobalSearch('')}
                            className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600"
                          >
                            <X size={14} />
                          </button>
                        )}
                      </div>

                      {isFiltered && (
                        <button
                          onClick={() => {
                            setGlobalSearch('');
                            setColumnFilters({});
                          }}
                          title="清除過濾條件"
                          className="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
                        >
                          <Filter size={18} />
                        </button>
                      )}
                      <button
                        onClick={promptClearAll}
                        title="關閉並清除資料"
                        className="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                      >
                        <Trash2 size={18} />
                      </button>
                    </div>
                  </div>
                </div>

                {/* 資料表格 */}
                <div className="overflow-x-auto relative max-h-[65vh]">
                  <table className="w-full text-left text-sm text-slate-600">
                    <thead className="text-xs text-slate-700 uppercase bg-slate-100 sticky top-0 z-10 shadow-sm">
                      <tr>
                        <th className="px-3 py-3 border-b border-slate-200 w-12 text-center bg-slate-100">狀態</th>
                        {headers.map((header, index) => (
                          <th key={index} className="px-4 py-3 border-b border-slate-200 whitespace-nowrap min-w-[140px] bg-slate-100">
                            <div className="flex flex-col gap-2">
                              <span className="font-semibold text-slate-800">{header}</span>
                              <input
                                type="text"
                                placeholder={`篩選 ${header}...`}
                                className="w-full px-2 py-1.5 text-xs border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 font-normal normal-case placeholder-slate-400 bg-white shadow-sm"
                                value={columnFilters[index] || ''}
                                onChange={(e) => handleColumnFilterChange(index, e.target.value)}
                              />
                            </div>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredData.length > 0 ? (
                        filteredData.map((row) => {
                          const isExcluded = excludedRowIds.has(row.id);
                          return (
                            <tr
                              key={row.id}
                              onDoubleClick={() => handleDoubleClickRow(row.id)}
                              className={`group transition-all cursor-pointer ${
                                isExcluded
                                ? 'bg-red-50/80 hover:bg-red-100'
                                : 'bg-white hover:bg-indigo-50/40'
                              }`}
                              title="雙擊以切換排除狀態 (網址請單擊圖示或文字)"
                            >
                              <td className="px-3 py-3 text-center align-middle">
                                {isExcluded ? (
                                  <Ban size={16} className="text-red-500 mx-auto" />
                                ) : (
                                  <CheckCircle2 size={16} className="text-emerald-400 mx-auto opacity-0 group-hover:opacity-100 transition-opacity" />
                                )}
                              </td>
                              {headers.map((header, colIndex) => (
                                <td
                                  key={colIndex}
                                  className={`px-4 py-3 max-w-[200px] 2xl:max-w-xs ${
                                    isExcluded ? 'text-red-800/60 line-through' : 'text-slate-700'
                                  }`}
                                >
                                  {renderCellContent(row.cells[colIndex], header, isExcluded)}
                                </td>
                              ))}
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan={headers.length + 1} className="px-6 py-16 text-center text-slate-500">
                            <div className="flex flex-col items-center justify-center gap-3">
                              <Search className="w-10 h-10 text-slate-300" />
                              <p className="text-base">找不到符合條件的資料</p>
                              <button
                                onClick={() => { setGlobalSearch(''); setColumnFilters({}); }}
                                className="text-indigo-600 hover:text-indigo-700 hover:underline text-sm font-medium"
                              >
                                清除所有篩選條件
                              </button>
                            </div>
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                {/* 底部狀態列 */}
                <div className="bg-slate-50 px-5 py-3 border-t border-slate-200 text-xs text-slate-500 flex justify-between items-center">
                  <span>
                    顯示 {filteredData.length} 筆結果
                    (將匯出 <strong className="text-indigo-600">{rowsToExport.length}</strong> 筆)
                  </span>
                  <span className="hidden md:inline text-slate-400">
                    提示：直接雙擊行即可標記為排除 (紅色) / 點擊藍色文字可開啟網頁
                  </span>
                </div>
              </div>
            ) : (
              /* 初始空狀態 */
              <div
                onClick={() => fileInputRef.current?.click()}
                className="bg-white rounded-2xl shadow-sm border-2 border-indigo-100 hover:border-indigo-300 border-dashed p-12 flex flex-col items-center justify-center text-center space-y-5 min-h-[500px] cursor-pointer transition-colors relative z-10 group"
              >
                <div className="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                  <FileUp size={40} />
                </div>
                <div>
                  <h3 className="text-xl font-bold text-slate-800 mb-2">將 CSV 檔案拖放至此</h3>
                  <p className="text-slate-500 max-w-md mx-auto leading-relaxed">
                    或點擊此處選擇檔案。<br/>上傳後您可以輕鬆篩選欄位、<strong className="text-red-500">雙擊剔除不要的名單</strong>，最後匯出乾淨的 CSV。
                  </p>
                </div>
                <button className="mt-2 flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl transition-all font-medium pointer-events-none">
                  <Upload size={20} />
                  選擇 CSV 檔案
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
